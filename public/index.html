<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Oportunidades de Licitação</title>
<style>
  /* Layout: coluna de filtros à esquerda, lista de editais à direita; empilha no celular. */
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --line: #e2e5ea; --fg: #1a1d23; --mut: #5c6472;
    --accent: #1f5fd6; --accent-soft: #e8f0fd; --money: #0a7d4f; --chip: #eef1f5;
    --font-ui: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --font-head: "Space Grotesk", var(--font-ui);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --line: #272d36; --fg: #e8eaee; --mut: #9aa3b2;
    --accent: #5b9bff; --accent-soft: #16233b; --money: #4fd091; --chip: #1e242d; color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #0f1216; --surface: #171b21; --line: #272d36; --fg: #e8eaee; --mut: #9aa3b2;
    --accent: #5b9bff; --accent-soft: #16233b; --money: #4fd091; --chip: #1e242d; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); line-height: 1.5; margin: 0; }
  a { color: var(--accent); }
  .shell { max-width: 1180px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
  header.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  header.top h1 { font-family: var(--font-head); font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  header.top p { color: var(--mut); margin: 0; font-size: 0.9rem; }
  .grid { display: grid; grid-template-columns: 290px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .filtros { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; flex-direction: column; gap: 2px; }
  label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--mut); margin: 12px 0 5px; display: block; }
  input, select { width: 100%; padding: 9px 11px; background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 9px; font: inherit; font-size: 0.9rem; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dupla { display: flex; gap: 8px; } .dupla > div { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .check input { width: auto; }
  button.buscar { margin-top: 18px; width: 100%; padding: 11px; background: var(--accent); color: #fff; border: 0; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  button.buscar:hover { filter: brightness(1.06); }
  .meta { color: var(--mut); font-size: 0.85rem; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px; margin-bottom: 12px; }
  .card h3 { font-family: var(--font-head); font-size: 1rem; margin: 0 0 4px; }
  .card .obj { color: var(--fg); font-size: 0.92rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
  .chip { font-size: 0.72rem; color: var(--mut); background: var(--chip); border-radius: 999px; padding: 3px 9px; }
  .chip.srp { color: var(--accent); background: var(--accent-soft); }
  .linha { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .val { color: var(--money); font-weight: 600; font-variant-numeric: tabular-nums; }
  .vazio, .erro { padding: 40px 16px; text-align: center; color: var(--mut); }
  .erro { color: #d14343; }
  .pager { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
  .pager button { padding: 8px 16px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); border-radius: 9px; cursor: pointer; font: inherit; }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  .skel { height: 92px; border-radius: 14px; background: linear-gradient(90deg, var(--surface), var(--chip), var(--surface)); background-size: 200% 100%; animation: sh 1.2s infinite; margin-bottom: 12px; }
  @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>
<body>


<div class="shell">
  <header class="top">
    <h1>Oportunidades de Licitação</h1>
    <p>Editais públicos, direto da base do PNCP</p>
  </header>

  <div class="grid">
    <aside class="panel filtros">
      <div>
        <label for="q">Palavra-chave</label>
        <input id="q" placeholder="ex.: notebook, merenda, veículo" />
      </div>
      <div>
        <label for="uf">UF</label>
        <input id="uf" placeholder="ex.: MG, SP" />
      </div>
      <div>
        <label for="modalidade">Modalidade</label>
        <select id="modalidade"><option value="">Todas</option></select>
      </div>
      <div class="dupla">
        <div><label for="valorMin">Valor mínimo</label><input id="valorMin" type="number" inputmode="numeric" /></div>
        <div><label for="valorMax">Valor máximo</label><input id="valorMax" type="number" inputmode="numeric" /></div>
      </div>
      <div>
        <label for="aberta">Com proposta aberta em</label>
        <input id="aberta" type="date" />
      </div>
      <div class="check"><input id="srp" type="checkbox" /><label for="srp" style="margin:0;text-transform:none;letter-spacing:0">Só Registro de Preço</label></div>
      <button class="buscar" id="btn">Buscar</button>
    </aside>

    <main>
      <div class="meta" id="meta">Carregando…</div>
      <div id="lista"></div>
      <div class="pager" id="pager" hidden>
        <button id="prev">← Anterior</button>
        <button id="next">Próxima →</button>
      </div>
    </main>
  </div>
</div>

<script>
const SUPABASE_URL = "https://nautccpjtclwftmmsijg.supabase.co";
const SUPABASE_KEY = "sb_publishable_Gofyyy-KtmQCZJ2TYoih1A_hpJhS0yc";
const MODALIDADES = {1:"Leilão - Eletrônico",2:"Diálogo Competitivo",3:"Concurso",4:"Concorrência - Eletrônica",5:"Concorrência - Presencial",6:"Pregão - Eletrônico",7:"Pregão - Presencial",8:"Dispensa de Licitação",9:"Inexigibilidade",10:"Manifestação de Interesse",11:"Pré-qualificação",12:"Credenciamento",13:"Leilão - Presencial"};
const PAGINA = 20;
let pagina = 1, totalPaginas = 1;

const $ = (id) => document.getElementById(id);
const semAcento = (s) => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const fmtBRL = (v) => v==null ? "—" : Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtData = (s) => s ? new Date(s).toLocaleDateString("pt-BR") : "—";

for (const [id,nome] of Object.entries(MODALIDADES)) {
  const o = document.createElement("option"); o.value = id; o.textContent = nome; $("modalidade").appendChild(o);
}

function construirURL() {
  const p = new URLSearchParams();
  p.set("select", "id,objeto,modalidade,modalidade_id,situacao,srp,valor_estimado,data_publicacao,data_encerramento_proposta,uf,municipio,link,orgaos(razao_social)");
  p.set("order", "data_publicacao.desc");
  p.set("limit", String(PAGINA));
  p.set("offset", String((pagina-1)*PAGINA));
  const termos = semAcento($("q").value.trim()).split(/\s+/).filter(Boolean);
  for (const t of termos) p.append("busca", `ilike.*${t}*`);
  const uf = $("uf").value.trim();
  if (uf) p.set("uf", `in.(${uf.split(",").map(x=>x.trim().toUpperCase()).filter(Boolean).join(",")})`);
  const mod = $("modalidade").value; if (mod) p.set("modalidade_id", `eq.${mod}`);
  if ($("valorMin").value) p.append("valor_estimado", `gte.${$("valorMin").value}`);
  if ($("valorMax").value) p.append("valor_estimado", `lte.${$("valorMax").value}`);
  if ($("srp").checked) p.set("srp", "eq.true");
  const d = $("aberta").value;
  if (d) { p.append("data_encerramento_proposta", `gte.${d}`); p.append("data_abertura_proposta", `lte.${d}T23:59:59`); }
  return `${SUPABASE_URL}/rest/v1/editais?${p.toString()}`;
}

async function buscar() {
  $("meta").textContent = "Buscando…";
  $("lista").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  $("pager").hidden = true;
  try {
    const res = await fetch(construirURL(), {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: "count=exact" },
    });
    if (!res.ok) throw new Error(`Erro ${res.status}`);
    const total = Number((res.headers.get("content-range")||"*/0").split("/")[1]) || 0;
    totalPaginas = Math.max(1, Math.ceil(total/PAGINA));
    const dados = await res.json();
    render(dados, total);
  } catch (e) {
    $("meta").textContent = "";
    $("lista").innerHTML = `<div class="erro">Não consegui carregar os editais. ${e.message}</div>`;
  }
}

function render(dados, total) {
  $("meta").textContent = total ? `${total.toLocaleString("pt-BR")} oportunidade(s) · página ${pagina} de ${totalPaginas}` : "";
  const lista = $("lista"); lista.innerHTML = "";
  if (!dados.length) { lista.innerHTML = '<div class="vazio">Nenhuma oportunidade com esses filtros. Tente ampliar a busca.</div>'; return; }
  for (const e of dados) {
    const el = document.createElement("article"); el.className = "card";
    const orgao = e.orgaos?.razao_social || "Órgão não informado";
    el.innerHTML = `
      <h3>${orgao}</h3>
      <div class="obj">${(e.objeto||"").slice(0,340)}</div>
      <div class="tags">
        <span class="chip">${e.uf||"—"}${e.municipio? " · "+e.municipio : ""}</span>
        <span class="chip">${e.modalidade||MODALIDADES[e.modalidade_id]||""}</span>
        ${e.situacao? `<span class="chip">${e.situacao}</span>`:""}
        ${e.srp? '<span class="chip srp">Registro de Preço</span>':""}
      </div>
      <div class="linha">
        <span><span class="val">${fmtBRL(e.valor_estimado)}</span> <span style="color:var(--mut);font-size:.82rem">estimado · propostas até ${fmtData(e.data_encerramento_proposta)}</span></span>
        ${e.link? `<a href="${e.link}" target="_blank" rel="noopener">ver edital no PNCP ↗</a>`:""}
      </div>`;
    lista.appendChild(el);
  }
  $("pager").hidden = false;
  $("prev").disabled = pagina<=1;
  $("next").disabled = pagina>=totalPaginas;
}

$("btn").onclick = () => { pagina = 1; buscar(); };
$("q").addEventListener("keydown", (ev)=>{ if(ev.key==="Enter"){ pagina=1; buscar(); }});
$("prev").onclick = () => { if(pagina>1){ pagina--; buscar(); window.scrollTo(0,0); } };
$("next").onclick = () => { if(pagina<totalPaginas){ pagina++; buscar(); window.scrollTo(0,0); } };
buscar();
</script>

</body>
</html>
